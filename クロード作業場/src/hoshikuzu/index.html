<title>ほしくず迎撃隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 縦長 9:16 のアーケード画面を中央に置く1画面構成。夜空の単一テーマ(ダーク固定) */
:root {
  --bg: #090b1f;      /* 夜空 */
  --deep: #151a44;    /* 機体の窓・影 */
  --ink: #e9ecff;     /* 文字 */
  --mint: #5ef2d6;    /* 自機・自機の弾 */
  --coral: #ff5d8f;   /* 敵(小型) */
  --orange: #ff8a4c;  /* 敵(中型) */
  --lilac: #b78cff;   /* 敵(回転型)・ボス */
  --amber: #ffd166;   /* 敵の弾・アイテム */
  --panel: rgba(21, 26, 68, 0.78);
  --font: "DotGothic16", ui-monospace, "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
#wrap {
  position: fixed;
  inset: 0;
  display: flex;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
#fit { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; box-shadow: 0 0 0 1px rgba(94, 242, 214, 0.2), 0 0 40px rgba(183, 140, 255, 0.12); }
canvas { display: block; touch-action: none; cursor: crosshair; }
.ctl { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.ctl button {
  font: inherit;
  font-size: 12px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid rgba(233, 236, 255, 0.25);
  border-radius: 3px;
  min-width: 48px;
  min-height: 32px;
  padding: 4px 8px;
  cursor: pointer;
}
.ctl button:disabled { opacity: 0.35; cursor: default; }
.ctl button:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }
</style>

<div id="wrap">
  <div id="fit">
    <div id="stage">
      <canvas id="cv" aria-label="シューティングゲーム画面"></canvas>
      <div class="ctl">
        <button id="pauseBtn" type="button">一時停止</button>
        <button id="soundBtn" type="button" aria-pressed="true">音 ON</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const W = 360, H = 640;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const fit = document.getElementById('fit');
  const pauseBtn = document.getElementById('pauseBtn');
  const soundBtn = document.getElementById('soundBtn');

  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const C = {
    bg: tok('--bg'), deep: tok('--deep'), ink: tok('--ink'), mint: tok('--mint'),
    coral: tok('--coral'), orange: tok('--orange'), lilac: tok('--lilac'), amber: tok('--amber'),
  };
  const FONT = '"DotGothic16", ui-monospace, monospace';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 画面で使う日本語のフォント字形を先読みする(canvas だけだと読み込まれないため)
  try {
    document.fonts.load('16px "DotGothic16"', 'ほしくず迎撃隊降りそそぐ機影を撃ち落とせ矢印キーで移動低速一時停止音スマホ画面をドラッグショットは自動発射されますタップでスタート再開もう一度ハイスコア更新警告大型機接近撃破ボーナス0123456789');
  } catch (e) {}

  // ---------- 画面サイズ ----------
  let scale = 1;
  function resize() {
    const r = fit.getBoundingClientRect();
    scale = Math.max(0.1, Math.min(r.width / W, r.height / H));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cw = W * scale, ch = H * scale;
    stage.style.width = cw + 'px';
    stage.style.height = ch + 'px';
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // ---------- 保存(ハイスコア・音設定) ----------
  const HI_KEY = 'hoshikuzu-hi', MUTE_KEY = 'hoshikuzu-mute';
  function loadHi() { try { return Number(localStorage.getItem(HI_KEY)) || 0; } catch (e) { return 0; } }
  function saveHi(v) { try { localStorage.setItem(HI_KEY, String(v)); } catch (e) {} }

  // ---------- 効果音(Web Audio で合成) ----------
  let actx = null, muted = false, noiseBuf = null;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(f, d, type, v, f2) {
    if (muted || !actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + d + 0.02);
  }
  function noise(d, v) {
    if (muted || !actx) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, Math.floor(actx.sampleRate * 1), actx.sampleRate);
      const a = noiseBuf.getChannelData(0);
      for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
    }
    const t = actx.currentTime, s = actx.createBufferSource(), g = actx.createGain(), fl = actx.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.value = 1100;
    s.buffer = noiseBuf;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl).connect(g).connect(actx.destination);
    s.start(t); s.stop(t + d);
  }
  const sfx = {
    shot: () => tone(880, 0.05, 'square', 0.012, 640),
    hit: () => tone(320, 0.04, 'square', 0.02, 200),
    boom: () => noise(0.32, 0.16),
    big: () => { noise(0.9, 0.3); tone(120, 0.8, 'sawtooth', 0.06, 40); },
    item: () => { tone(660, 0.08, 'triangle', 0.07, 990); setTimeout(() => tone(990, 0.1, 'triangle', 0.07, 1320), 70); },
    dmg: () => { noise(0.5, 0.25); tone(220, 0.4, 'sawtooth', 0.06, 60); },
    warn: () => { tone(440, 0.25, 'square', 0.04); setTimeout(() => tone(440, 0.25, 'square', 0.04), 350); },
  };

  // ---------- 便利関数 ----------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const d2 = (a, b) => { const x = a.x - b.x, y = a.y - b.y; return x * x + y * y; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pad = (n, l) => String(Math.floor(n)).padStart(l, '0');

  // ---------- 状態 ----------
  let state = 'title';       // title / play / pause / over
  let hi = loadHi(), overLock = 0, blink = 0;
  let G, P, pb, eb, en, items, parts, texts;
  const stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() });

  function reset() {
    G = { score: 0, wave: 1, waveT: 0, spawnT: 1.2, banner: { text: 'WAVE 1', t: 2 }, boss: null, bossPending: false, shake: 0, shotTick: 0, newHi: false };
    P = { x: W / 2, y: H - 90, lv: 1, lives: 3, inv: 2, cd: 0 };
    pb = []; eb = []; en = []; items = []; parts = []; texts = [];
  }
  function start() { audio(); reset(); state = 'play'; syncBtns(); }
  function togglePause() {
    if (state === 'play') state = 'pause';
    else if (state === 'pause') { state = 'play'; last = performance.now(); }
    syncBtns();
  }
  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
    syncBtns();
  }
  function syncBtns() {
    pauseBtn.textContent = state === 'pause' ? '再開' : '一時停止';
    pauseBtn.disabled = !(state === 'play' || state === 'pause');
    soundBtn.textContent = muted ? '音 OFF' : '音 ON';
    soundBtn.setAttribute('aria-pressed', String(!muted));
  }
  pauseBtn.addEventListener('click', () => { togglePause(); pauseBtn.blur(); });
  soundBtn.addEventListener('click', () => { audio(); toggleMute(); soundBtn.blur(); });

  // ---------- 入力 ----------
  const keys = {};
  addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'BUTTON') return;
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    if (e.code === 'Enter' || e.code === 'Space') {
      if ((state === 'title' || state === 'over') && overLock <= 0) start();
      else if (state === 'pause') togglePause();
    }
    if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    if (e.code === 'KeyM') { audio(); toggleMute(); }
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') togglePause(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  // スマホ:画面のどこをドラッグしても自機が同じだけ動く(指で自機が隠れない)
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    audio();
    if (state === 'title' || state === 'over') { if (overLock <= 0) start(); return; }
    if (state === 'pause') { togglePause(); return; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, px: P.x, py: P.y };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id || state !== 'play') return;
    P.x = clamp(drag.px + (e.clientX - drag.sx) / scale * 1.2, 12, W - 12);
    P.y = clamp(drag.py + (e.clientY - drag.sy) / scale * 1.2, 40, H - 20);
  });
  const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  // ---------- 敵 ----------
  const TYPES = {
    drone:   { hp: 1,  r: 11, score: 100 },
    guard:   { hp: 6,  r: 15, score: 300 },
    spinner: { hp: 10, r: 17, score: 500 },
    boss:    { hp: 1,  r: 40, score: 5000 },
  };
  const mul = () => Math.min(1 + (G.wave - 1) * 0.07, 1.7);   // 難易度(弾の速さ)

  function addEnemy(type, x, y, o) {
    const T = TYPES[type];
    const e = Object.assign({ type, x, y, x0: x, hp: T.hp, max: T.hp, r: T.r, t: 0, cd: 1, flash: 0 }, o || {});
    en.push(e);
    return e;
  }
  function spawnGroup() {
    const w = G.wave, r = Math.random();
    if (w >= 2 && r < 0.1 + w * 0.025) {
      addEnemy('spinner', rnd(40, W - 40), -30, { vy: 38, cd: 0.8 });
    } else if (r < 0.42) {
      addEnemy('guard', rnd(40, W - 40), -30, { ty: rnd(70, 220), cd: 1.0 });
    } else {
      const n = 4 + Math.min(3, w >> 1), amp = rnd(20, 60), dir = Math.random() < 0.5 ? -1 : 1;
      const x = rnd(amp + 18, W - amp - 18);
      for (let i = 0; i < n; i++) {
        addEnemy('drone', x, -20 - i * 34, { amp, dir, ph: i * 0.5, vy: 90 + w * 6, shoots: w >= 3 && Math.random() < 0.25, cd: rnd(0.3, 1.5) });
      }
    }
  }
  function spawnBoss() {
    const lvl = G.wave / 4;
    const b = addEnemy('boss', W / 2, -60, { cd: 1.5, pt: 0, ang: 0 });
    b.hp = b.max = 160 + lvl * 70;
    G.boss = b;
  }
  function fireE(x, y, a, s) { eb.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 4 }); }
  function aim(e, s, off) { fireE(e.x, e.y + e.r * 0.5, Math.atan2(P.y - e.y, P.x - e.x) + (off || 0), s); }

  function updEnemy(e, dt) {
    e.t += dt; e.flash -= dt;
    const m = mul();
    if (e.type === 'drone') {
      e.y += e.vy * dt;
      e.x = e.x0 + Math.sin(e.t * 2.2 + e.ph) * e.amp * e.dir;
      if (e.shoots) {
        e.cd -= dt;
        if (e.cd <= 0 && e.y > 40 && e.y < H * 0.6) { e.shoots = false; aim(e, 140 * m); }
      }
    } else if (e.type === 'guard') {
      if (e.t < 6) e.y += (e.ty - e.y) * Math.min(1, dt * 2);
      else e.y += 120 * dt;
      e.cd -= dt;
      if (e.cd <= 0 && e.t < 6 && e.y > 20) {
        e.cd = Math.max(0.7, 1.6 - G.wave * 0.08);
        aim(e, 150 * m);
        if (G.wave >= 3) { aim(e, 150 * m, 0.25); aim(e, 150 * m, -0.25); }
      }
    } else if (e.type === 'spinner') {
      e.y += e.vy * dt;
      e.cd -= dt;
      if (e.cd <= 0 && e.y > 20 && e.y < H * 0.7) {
        e.cd = Math.max(1.1, 2 - G.wave * 0.07);
        const n = 8 + Math.min(8, G.wave);
        for (let i = 0; i < n; i++) fireE(e.x, e.y, e.t + i * Math.PI * 2 / n, 110 * m);
      }
    } else if (e.type === 'boss') {
      updBoss(e, dt, m);
    }
  }
  // ボス:6秒ごとに「狙い撃ち扇」「二重らせん」「全方位リング」を切り替える
  function updBoss(e, dt, m) {
    if (e.y < 130) { e.y += 70 * dt; return; }
    e.pt += dt;
    e.x = W / 2 + Math.sin(e.pt * 0.7) * 100;
    const rage = e.hp < e.max * 0.5 ? 1.3 : 1;
    const ph = Math.floor(e.pt / 6) % 3;
    e.cd -= dt * rage;
    if (e.cd > 0) return;
    if (ph === 0) { for (let i = -2; i <= 2; i++) aim(e, 170 * m, i * 0.2); e.cd = 0.9; }
    else if (ph === 1) { e.ang += 0.4; for (let k = 0; k < 2; k++) fireE(e.x, e.y, e.ang + k * Math.PI, 130 * m); e.cd = 0.07; }
    else { e.ang += 0.17; for (let i = 0; i < 18; i++) fireE(e.x, e.y, e.ang + i * Math.PI * 2 / 18, 115 * m); e.cd = 1.1; }
  }

  // ---------- 演出 ----------
  function banner(text, t) { G.banner = { text, t }; }
  function addScore(n, x, y) {
    G.score += n;
    texts.push({ x, y, s: '+' + n, t: 0 });
  }
  function explode(x, y, col, n, R) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = rnd(40, 40 + R * 4);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.35, 0.9), max: 0.9, col, sz: rnd(1, 3.2) });
    }
    parts.push({ ring: true, x, y, life: 0.35, max: 0.35, col, R: R * 2.6 });
  }
  function spark(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = rnd(30, 120);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.1, 0.3), max: 0.3, col, sz: 1.5 });
    }
  }
  function drop(k, x, y) { items.push({ k, x, y, vy: -60, t: 0 }); }

  function kill(e) {
    e.dead = true;
    if (e.type === 'boss') {
      const pts = Math.round(TYPES.boss.score * G.wave / 4);
      addScore(pts, e.x, e.y);
      explode(e.x, e.y, C.coral, 70, 40);
      explode(e.x - 30, e.y + 10, C.lilac, 30, 25);
      explode(e.x + 30, e.y - 5, C.amber, 30, 25);
      drop('P', e.x - 22, e.y); drop('P', e.x + 22, e.y); drop('H', e.x, e.y);
      for (const b of eb) spark(b.x, b.y, C.amber, 1);
      eb.length = 0;
      G.boss = null;
      G.wave++; G.waveT = 0; G.spawnT = 2;
      banner('WAVE ' + G.wave, 2.2);
      if (!reduce) G.shake = 14;
      sfx.big();
      return;
    }
    const col = e.type === 'drone' ? C.coral : e.type === 'guard' ? C.orange : C.lilac;
    addScore(TYPES[e.type].score, e.x, e.y);
    explode(e.x, e.y, col, e.type === 'drone' ? 14 : 24, e.r);
    sfx.boom();
    if (!reduce) G.shake = Math.max(G.shake, e.type === 'drone' ? 1.5 : 4);
    const r = Math.random(), pr = e.type === 'drone' ? 0.05 : e.type === 'guard' ? 0.22 : 0.35;
    if (r < pr) drop('P', e.x, e.y);
    else if (r < pr + 0.025) drop('H', e.x, e.y);
  }
  function hurt() {
    P.lives--;
    P.inv = 2.2;
    P.lv = Math.max(1, P.lv - 1);
    explode(P.x, P.y, C.mint, 30, 16);
    sfx.dmg();
    if (!reduce) G.shake = 10;
    for (const b of eb) if (d2(b, P) < 120 * 120) b.dead = true;
    if (P.lives <= 0) {
      state = 'over';
      overLock = 1;
      if (G.score > hi) { hi = G.score; saveHi(hi); G.newHi = true; }
      syncBtns();
    }
  }

  // ---------- 自機 ----------
  function updPlayer(dt) {
    let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    const sp = keys.ShiftLeft || keys.ShiftRight ? 130 : 250;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    P.x = clamp(P.x + dx * sp * dt, 12, W - 12);
    P.y = clamp(P.y + dy * sp * dt, 40, H - 20);
    P.inv -= dt;
    P.cd -= dt;
    if (P.cd <= 0) { P.cd = 0.085; shoot(); }
  }
  function shoot() {
    const L = P.lv, y = P.y - 16;
    const add = (x, a) => pb.push({ x, y, vx: Math.sin(a) * 720, vy: -Math.cos(a) * 720 });
    if (L === 1) add(P.x, 0);
    else if (L === 2) { add(P.x - 6, 0); add(P.x + 6, 0); }
    else if (L === 3) { add(P.x, 0); add(P.x - 6, -0.12); add(P.x + 6, 0.12); }
    else { add(P.x - 5, 0); add(P.x + 5, 0); add(P.x - 8, -0.14); add(P.x + 8, 0.14); add(P.x - 10, -0.28); add(P.x + 10, 0.28); }
    if (++G.shotTick % 2 === 0) sfx.shot();
  }

  // ---------- 出現管理 ----------
  function director(dt) {
    if (G.boss) return;
    if (G.bossPending) {
      if (en.length === 0) { G.bossPending = false; spawnBoss(); }
      return;
    }
    G.waveT += dt;
    if (G.waveT > 22) {
      G.wave++; G.waveT = 0;
      if (G.wave % 4 === 0) { G.bossPending = true; banner('警告  大型機 接近', 2.6); sfx.warn(); }
      else banner('WAVE ' + G.wave, 2);
      return;
    }
    G.spawnT -= dt;
    if (G.spawnT <= 0) { spawnGroup(); G.spawnT = Math.max(0.55, 1.5 - G.wave * 0.09); }
  }

  // ---------- 更新 ----------
  function updStars(dt) {
    for (const s of stars) {
      s.y += (20 + s.z * 120) * dt;
      if (s.y > H) { s.y -= H; s.x = Math.random() * W; }
    }
  }
  function updParts(dt) {
    for (const p of parts) {
      p.life -= dt;
      if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    }
    parts = parts.filter(p => p.life > 0);
    if (parts.length > 700) parts.splice(0, parts.length - 700);
    for (const t of texts) t.t += dt;
    texts = texts.filter(t => t.t < 0.8);
  }
  function update(dt) {
    updStars(dt);
    updPlayer(dt);
    director(dt);

    for (const b of pb) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true; }
    for (const e of en) { updEnemy(e, dt); if (e.y > H + 60 || e.x < -80 || e.x > W + 80) e.dead = true; }
    for (const b of eb) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) b.dead = true; }

    // 自機の弾 → 敵
    for (const b of pb) {
      if (b.dead) continue;
      for (const e of en) {
        if (e.dead || (e.type === 'boss' && e.y < 130)) continue;
        if (d2(b, e) < (e.r + 3) * (e.r + 3)) {
          b.dead = true;
          e.hp--;
          e.flash = 0.06;
          spark(b.x, b.y, C.mint, 2);
          if (e.hp <= 0) kill(e);
          else if (Math.random() < 0.15) sfx.hit();
          break;
        }
      }
    }
    // 敵の弾・体当たり → 自機(当たり判定は自機中央の白い点だけ)
    if (state === 'play' && P.inv <= 0) {
      for (const b of eb) {
        if (!b.dead && d2(b, P) < (b.r + 3) * (b.r + 3)) { b.dead = true; hurt(); break; }
      }
    }
    if (state === 'play' && P.inv <= 0) {
      for (const e of en) {
        if (!e.dead && d2(e, P) < (e.r * 0.7 + 4) * (e.r * 0.7 + 4)) {
          if (e.type !== 'boss') { e.hp -= 5; if (e.hp <= 0) kill(e); }
          hurt();
          break;
        }
      }
    }
    // アイテム(近づくと吸い寄せられる)
    for (const it of items) {
      it.t += dt;
      it.vy = Math.min(it.vy + 120 * dt, 70);
      it.y += it.vy * dt;
      const dx = P.x - it.x, dy = P.y - it.y, dist = Math.hypot(dx, dy);
      if (state === 'play' && dist < 16) {
        it.dead = true;
        sfx.item();
        if (it.k === 'P') {
          if (P.lv < 4) { P.lv++; texts.push({ x: P.x, y: P.y - 24, s: 'POWER UP', t: 0 }); }
          else addScore(1000, P.x, P.y - 24);
        } else {
          if (P.lives < 5) { P.lives++; texts.push({ x: P.x, y: P.y - 24, s: '1UP', t: 0 }); }
          else addScore(2000, P.x, P.y - 24);
        }
      } else if (state === 'play' && dist < 80) {
        it.x += dx / dist * 200 * dt;
        it.y += dy / dist * 200 * dt;
      }
      if (it.y > H + 20) it.dead = true;
    }

    pb = pb.filter(o => !o.dead);
    eb = eb.filter(o => !o.dead);
    en = en.filter(o => !o.dead);
    items = items.filter(o => !o.dead);
    updParts(dt);
    G.banner.t -= dt;
    G.shake = Math.max(0, G.shake - dt * 30);
  }

  // ---------- 描画 ----------
  function shape(pts, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i][0], pts[i][1]) : ctx.moveTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  function circle(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); }

  function drawShip(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    const f = 8 + Math.random() * 6;
    shape([[-5, 10], [0, 10 + f], [5, 10]], C.amber);
    shape([[0, -18], [6, -4], [16, 8], [16, 12], [5, 9], [3, 13], [-3, 13], [-5, 9], [-16, 12], [-16, 8], [-6, -4]], C.mint);
    ctx.fillStyle = C.deep;
    ctx.beginPath(); ctx.ellipse(0, -4, 2.6, 5, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  function drawPlayer() {
    if (P.inv > 0 && Math.floor(P.inv * 16) % 2) return;
    drawShip(P.x, P.y, 1);
    circle(P.x, P.y + 3, 2.6, '#ffffff');
  }
  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const fl = e.flash > 0;
    if (e.type === 'drone') {
      ctx.rotate(Math.sin(e.t * 4) * 0.25);
      shape([[0, 12], [11, 0], [0, -10], [-11, 0]], fl ? '#fff' : C.coral);
      shape([[0, 5], [4, 0], [0, -4], [-4, 0]], C.deep);
    } else if (e.type === 'guard') {
      const pts = [];
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; pts.push([Math.cos(a) * 16, Math.sin(a) * 16]); }
      shape(pts, fl ? '#fff' : C.orange);
      circle(0, 2, 6, C.deep);
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      circle(Math.cos(a) * 2.5, 2 + Math.sin(a) * 2.5, 2.6, C.amber);
    } else if (e.type === 'spinner') {
      ctx.rotate(e.t * 2);
      const pts = [];
      for (let i = 0; i < 8; i++) { const r = i % 2 ? 7 : 19, a = i * Math.PI / 4; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
      shape(pts, fl ? '#fff' : C.lilac);
      circle(0, 0, 5, C.deep);
    } else {
      const body = fl ? '#fff' : C.lilac;
      shape([[-62, -6], [-26, -26], [26, -26], [62, -6], [52, 16], [22, 10], [0, 32], [-22, 10], [-52, 16]], body);
      shape([[-40, -4], [-20, -16], [-20, 6]], C.deep);
      shape([[40, -4], [20, -16], [20, 6]], C.deep);
      circle(-46, 10, 6, fl ? '#fff' : C.coral);
      circle(46, 10, 6, fl ? '#fff' : C.coral);
      const pulse = 11 + Math.sin(e.t * 8) * 2;
      circle(0, 0, pulse + 4, C.deep);
      circle(0, 0, pulse, e.hp < e.max * 0.5 ? C.coral : C.amber);
    }
    ctx.restore();
  }
  function drawItem(it) {
    const bob = Math.sin(it.t * 6) * 2;
    ctx.save();
    ctx.translate(it.x, it.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = it.k === 'P' ? C.amber : C.coral;
    ctx.fillRect(-9, -9, 18, 18);
    ctx.restore();
    ctx.fillStyle = C.deep;
    ctx.font = '14px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.k === 'P' ? 'P' : '♥', it.x, it.y + bob + 1);
  }

  function drawWorld() {
    for (const it of items) drawItem(it);
    for (const e of en) drawEnemy(e);
    if (state !== 'over') drawPlayer();

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = C.mint;
    for (const b of pb) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vx, -b.vy));
      ctx.fillRect(-1.5, -8, 3, 14);
      ctx.restore();
    }
    for (const p of parts) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.ring) {
        ctx.strokeStyle = p.col;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.R * (1 - a) + 4, 0, 6.283); ctx.stroke();
      } else {
        ctx.fillStyle = p.col;
        ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    // 敵の弾は「黄色の縁+白い芯」で、自機の弾と見分けやすく
    for (const b of eb) {
      circle(b.x, b.y, b.r + 1.5, C.amber);
      circle(b.x, b.y, b.r - 1.5, '#fff');
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '12px ' + FONT;
    for (const t of texts) {
      ctx.globalAlpha = 1 - t.t / 0.8;
      ctx.fillStyle = C.ink;
      ctx.fillText(t.s, t.x, t.y - t.t * 30);
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = C.ink;
    ctx.globalAlpha = 0.6;
    ctx.font = '11px ' + FONT;
    ctx.fillText('SCORE', 12, 10);
    ctx.fillText('HI ' + pad(Math.max(hi, G.score), 7), 12, 46);
    ctx.globalAlpha = 1;
    ctx.font = '20px ' + FONT;
    ctx.fillText(pad(G.score, 7), 12, 22);
    ctx.font = '11px ' + FONT;
    ctx.fillStyle = C.lilac;
    ctx.fillText('WAVE ' + G.wave, 12, 62);

    if (G.boss && G.boss.y >= 130) {
      const w = W - 24, r = G.boss.hp / G.boss.max;
      ctx.fillStyle = C.deep; ctx.fillRect(12, 82, w, 6);
      ctx.fillStyle = r < 0.5 ? C.coral : C.lilac; ctx.fillRect(12, 82, w * r, 6);
    }

    // 残機
    for (let i = 0; i < P.lives; i++) drawShip(20 + i * 20, H - 22, 0.5);
    // ショットレベル
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink;
    ctx.globalAlpha = 0.6;
    ctx.font = '11px ' + FONT;
    ctx.fillText('SHOT', W - 66, H - 22);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = i < P.lv ? C.mint : C.deep;
      ctx.fillRect(W - 60 + i * 12, H - 27, 9, 10);
    }

    if (G.banner.t > 0 && state === 'play') {
      ctx.globalAlpha = Math.min(1, G.banner.t * 2);
      ctx.textAlign = 'center';
      ctx.font = '26px ' + FONT;
      ctx.fillStyle = G.banner.text.startsWith('警告') ? C.coral : C.ink;
      ctx.fillText(G.banner.text, W / 2, H * 0.4);
      ctx.globalAlpha = 1;
    }
  }

  function dim(a) { ctx.fillStyle = 'rgba(9, 11, 31, ' + a + ')'; ctx.fillRect(0, 0, W, H); }
  function centerText(s, y, size, col, alpha) {
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = size + 'px ' + FONT;
    ctx.fillStyle = col;
    ctx.fillText(s, W / 2, y);
    ctx.globalAlpha = 1;
  }

  function drawTitle() {
    drawShip(W / 2, 470 + Math.sin(blink * 2) * 6, 1.6);
    centerText('ほしくず', 150, 52, C.mint);
    centerText('迎撃隊', 210, 52, C.ink);
    centerText('降りそそぐ機影を撃ち落とせ', 262, 14, C.lilac);

    ctx.fillStyle = 'rgba(21, 26, 68, 0.78)';
    ctx.fillRect(34, 296, W - 68, 118);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = '12px ' + FONT;
    const lines = [
      ['PC', '矢印キー / WASD で移動'],
      ['', 'Shift で低速、P で一時停止、M で音'],
      ['スマホ', '画面をドラッグで移動'],
      ['', 'ショットは自動で発射されます'],
      ['', '白い点だけが当たり判定です'],
    ];
    lines.forEach(([a, b], i) => {
      ctx.fillStyle = C.amber; ctx.fillText(a, 48, 308 + i * 20);
      ctx.fillStyle = C.ink; ctx.fillText(b, 104, 308 + i * 20);
    });

    centerText('タップ / Enter でスタート', 560, 16, C.ink, 0.55 + Math.sin(blink * 4) * 0.45);
    centerText('HI SCORE  ' + pad(hi, 7), 596, 12, C.ink, 0.6);
  }
  function drawOver() {
    dim(0.6);
    centerText('GAME OVER', 220, 34, C.coral);
    centerText('SCORE  ' + pad(G.score, 7), 280, 18, C.ink);
    centerText('WAVE ' + G.wave + ' まで到達', 310, 13, C.lilac);
    if (G.newHi) centerText('ハイスコア更新！', 346, 16, C.amber);
    if (overLock <= 0) centerText('タップ / Enter でもう一度', 420, 15, C.ink, 0.55 + Math.sin(blink * 4) * 0.45);
  }
  function drawPause() {
    dim(0.55);
    centerText('一時停止中', 280, 26, C.ink);
    centerText('タップ / P で再開', 320, 13, C.ink, 0.7);
  }

  function draw() {
    ctx.save();
    if (G.shake > 0 && state === 'play') ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    ctx.fillStyle = C.bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + s.z * 0.6;
      ctx.fillStyle = s.z > 0.85 ? C.lilac : C.ink;
      ctx.fillRect(s.x, s.y, s.z > 0.6 ? 2 : 1, s.z > 0.6 ? 2 + s.z * 2 : 1);
    }
    ctx.globalAlpha = 1;
    if (state !== 'title') drawWorld();
    ctx.restore();

    if (state === 'title') drawTitle();
    else {
      drawHUD();
      if (state === 'over') drawOver();
      if (state === 'pause') drawPause();
    }
  }

  // ---------- ループ ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    blink += dt;
    if (state === 'play') update(dt);
    else if (state !== 'pause') { updStars(dt * 0.4); updParts(dt); overLock -= dt; }
    draw();
    requestAnimationFrame(frame);
  }
  reset();
  syncBtns();
  requestAnimationFrame(frame);
})();
</script>
